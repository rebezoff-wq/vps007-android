name: Build VPS 007 APK

# Runs on every push to main/master and manually from the Actions tab.
# Without signing secrets it builds a debug APK (installable for testing).
# With secrets APP_KEYSTORE_BASE64 / APP_KEYSTORE_PASSWORD / APP_KEYSTORE_ALIAS / APP_KEY_PASSWORD
# it also builds signed release APKs and an AAB for Google Play.
# Pushing a tag like v1.0.1 publishes a GitHub Release with the signed APKs;
# installed apps find it via «Check for updates» (version = tag without the leading v).

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Download libv2ray (Xray core) matching the submodule tag
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
        echo "AndroidLibXrayLite tag: $TAG"
        mkdir -p V2rayNG/app/libs
        gh release download "$TAG" --repo 2dust/AndroidLibXrayLite \
          --pattern 'libv2ray.aar' --dir V2rayNG/app/libs --clobber

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Version from tag
      run: |
        ARGS="-PVERSION_CODE=${{ github.run_number }}"
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          ARGS="$ARGS -PVERSION_NAME=${GITHUB_REF_NAME#v}"
        fi
        echo "VERSION_ARGS=$ARGS" >> $GITHUB_ENV

    - name: Check signing secrets
      id: signing
      env:
        KS: ${{ secrets.APP_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KS" ]; then
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "enabled=true" >> $GITHUB_OUTPUT
        else
          echo "enabled=false" >> $GITHUB_OUTPUT
          echo "::notice::No signing secrets - building debug APK only"
        fi

    - name: Build debug APK
      if: steps.signing.outputs.enabled != 'true'
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreDebug $VERSION_ARGS

    - name: Build signed release APK + AAB
      if: steps.signing.outputs.enabled == 'true'
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}"
        ./gradlew assemblePlaystoreRelease $VERSION_ARGS $SIGN
        # Google Play build: no self-update from GitHub (Play policy).
        ./gradlew bundlePlaystoreRelease $VERSION_ARGS -PSELF_UPDATE=false $SIGN

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: VPS007-apk
        path: V2rayNG/app/build/outputs/apk/playstore/*/*.apk

    - name: Upload AAB (Google Play)
      if: steps.signing.outputs.enabled == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: VPS007-aab
        path: V2rayNG/app/build/outputs/bundle/playstoreRelease/*.aab

    - name: Publish GitHub Release (tags only)
      if: github.ref_type == 'tag' && steps.signing.outputs.enabled == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK=$(ls V2rayNG/app/build/outputs/apk/playstore/release/*universal*.apk 2>/dev/null | head -1)
        [ -n "$APK" ] || APK=$(ls V2rayNG/app/build/outputs/apk/playstore/release/*arm64-v8a*.apk | head -1)
        echo "Stable APK from: $APK"
        cp "$APK" vps007-latest.apk
        sha256sum vps007-latest.apk > vps007-latest.apk.sha256
        gh release create "${GITHUB_REF_NAME}" \
          V2rayNG/app/build/outputs/apk/playstore/release/*.apk vps007-latest.apk vps007-latest.apk.sha256 \
          --repo "${GITHUB_REPOSITORY}" --title "VPS 007 ${GITHUB_REF_NAME}" --generate-notes
